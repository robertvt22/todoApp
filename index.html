<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/public/favicon1.gif" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/src/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>To Do App</title>
</head>

<body>

  <div class="app">

    <main class="dashboard-main">
      <div class="container-main">
        <div class="todo-header">
          <div class="todo-header-info">
            <div class="todo-header-info-date">
              <i class="fa-solid fa-arrow-left"></i>
              <p class="todo-currentDate">11 sept. 2026</p>
              <i class="fa-solid fa-arrow-right"></i>
            </div>
            <h1 class="todo-title">My tasks</h1>
          </div>
          <div class="todo-header-status">
            <p class="todo-header-status-completed">
              <span class="todo-count"> <span class="todo-countNumberDone"></span>/ <span
                  class="todo-countNumber"></span></span>
              <span class="todo-description">completed</span>
            </p>
          </div>
        </div>
        <div class="todo-task">
          <div class="todo-task-input">
            <input type="text" id="task" class="todo-input" placeholder="Add new Task">
            <button class="btn-add"><i class="fa-solid fa-plus"></i></button>
          </div>
          <div class="todo-task-button"></div>
        </div>
        <div class="todo-list">

        </div>
      </div>
    </main>

    <footer class="dashboard-footer">
      <p class="description-footer">
        ©2026 Maverick inc. All rights reserved.
      </p>
    </footer>


    <script type="module" src="/src/main.js"></script>
</body>

</html>
